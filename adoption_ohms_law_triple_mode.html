<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adoption as Ohm's Law</title>
<link rel="stylesheet" href="adoption_ohms_law_triple_mode.css">
</head>
<body>
<div class="wrap">
<div class="card">

<header class="head">
  <h1>Adoption as Ohm's Law</h1>
  <p>One model, three lenses — physics, water, and business. Drag the point on the plane to see how resistance and potential drive flow.</p>
</header>

<div class="modes" role="group" aria-label="Mode">
  <button id="m-phys" class="mode-btn">Physics</button>
  <button id="m-water" class="mode-btn">Water</button>
  <button id="m-biz" class="mode-btn">Business</button>
</div>

<div id="verdict" class="story"></div>

<div class="diagrams">

<div class="panel plane-panel">
<svg id="plane" width="100%" viewBox="0 0 380 362" role="img" style="touch-action:none; cursor:crosshair;">
<title>adoption plane</title><desc>Resistance horizontal, potential vertical, both from zero. Four regions and a draggable point with a ray whose slope is flow.</desc>
<rect x="50" y="20" width="150" height="150" fill="#EAF3DE"/>
<rect x="200" y="20" width="150" height="150" fill="#E6F1FB"/>
<rect x="50" y="170" width="150" height="150" fill="#FAEEDA"/>
<rect x="200" y="170" width="150" height="150" fill="#FCEBEB"/>
<text id="c-tl" x="60" y="40" font-family="sans-serif" font-size="13.5" font-weight="500" fill="#27500A">Hot</text>
<text id="c-tr" x="210" y="40" font-family="sans-serif" font-size="13.5" font-weight="500" fill="#042C53">Displacement</text>
<text id="c-bl" x="60" y="190" font-family="sans-serif" font-size="13.5" font-weight="500" fill="#633806">Dormant</text>
<text id="c-br" x="210" y="190" font-family="sans-serif" font-size="13.5" font-weight="500" fill="#501313">Phantom</text>
<line x1="50" y1="320" x2="350" y2="20" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 4"/>
<text id="threshlbl" x="305" y="78" font-family="sans-serif" font-size="11" fill="#5F5E5A">I = 1</text>
<line x1="200" y1="20" x2="200" y2="320" stroke="#B4B2A9" stroke-width="0.5"/>
<line x1="50" y1="170" x2="350" y2="170" stroke="#B4B2A9" stroke-width="0.5"/>
<line id="ray" x1="50" y1="320" x2="125" y2="95" stroke="#26215C" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6"/>
<line x1="50" y1="320" x2="350" y2="320" stroke="#3d3d3a" stroke-width="1"/>
<line x1="50" y1="20" x2="50" y2="320" stroke="#3d3d3a" stroke-width="1"/>
<text id="xaxis" x="200" y="350" font-family="sans-serif" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle">R  (resistance) →</text>
<text id="yaxis" x="18" y="170" font-family="sans-serif" font-size="13" font-weight="500" fill="#3d3d3a" text-anchor="middle" transform="rotate(-90 18 170)">V (potential difference) →</text>
<text x="52" y="332" font-family="sans-serif" font-size="10" fill="#888780">0</text>
<circle id="probe" cx="125" cy="95" r="9" fill="#26215C" stroke="#fff" stroke-width="2"/>
</svg>
</div>

<div class="panel side-panel">

<svg id="circuit" width="100%" viewBox="0 0 280 180" role="img" style="margin-bottom:8px;">
<title>circuit with bulb</title><desc>A battery drives current through one bulb; brightness reflects power.</desc>
<rect x="20" y="22" width="240" height="120" rx="10" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<line x1="50" y1="52" x2="120" y2="52" stroke="#26215C" stroke-width="3"/>
<line x1="160" y1="52" x2="230" y2="52" stroke="#26215C" stroke-width="3"/>
<line x1="230" y1="52" x2="230" y2="112" stroke="#26215C" stroke-width="3"/>
<line x1="230" y1="112" x2="50" y2="112" stroke="#26215C" stroke-width="3"/>
<line x1="50" y1="112" x2="50" y2="52" stroke="#26215C" stroke-width="3"/>
<line x1="44" y1="64" x2="56" y2="64" stroke="#3d3d3a" stroke-width="2"/>
<line x1="40" y1="78" x2="60" y2="78" stroke="#3d3d3a" stroke-width="4"/>
<line x1="44" y1="92" x2="56" y2="92" stroke="#3d3d3a" stroke-width="2"/>
<text x="14" y="82" font-family="sans-serif" font-size="12" font-weight="500" fill="#3d3d3a" text-anchor="middle">V</text>
<circle id="halo" cx="140" cy="52" r="20" fill="#FAC775" opacity="0"/>
<circle id="bulb" cx="140" cy="52" r="13" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<line x1="140" y1="65" x2="140" y2="72" stroke="#5F5E5A" stroke-width="1"/>
<path id="filament" d="M133 52 Q137 46 140 52 Q143 58 147 52" fill="none" stroke="#B4B2A9" stroke-width="1.5"/>
</svg>

<svg id="water" width="100%" viewBox="0 0 280 180" role="img" style="margin-bottom:8px; display:none;">
<title>tank and pipe</title><desc>Water at height V drains through a pipe whose narrowness is R. Stream vigour reflects flow.</desc>
<rect x="40" y="30" width="90" height="110" rx="4" fill="none" stroke="#B4B2A9" stroke-width="1.5"/>
<rect id="watercol" x="42" y="80" width="86" height="58" fill="#85B7EB" opacity="0.8"/>
<text id="headlbl" x="85" y="22" font-family="sans-serif" font-size="11" font-weight="500" fill="#185FA5" text-anchor="middle">head (pressure)</text>
<line id="headtick" x1="34" y1="80" x2="40" y2="80" stroke="#185FA5" stroke-width="2"/>
<rect id="pipe" x="130" y="126" width="60" height="10" fill="#B5D4F4" stroke="#378ADD" stroke-width="1"/>
<text id="pipelbl" x="160" y="118" font-family="sans-serif" font-size="11" fill="#185FA5" text-anchor="middle">pipe (R)</text>
<rect x="196" y="120" width="60" height="50" rx="3" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<rect id="outpool" x="198" y="150" width="56" height="18" rx="2" fill="#85B7EB" opacity="0.8"/>
<line id="stream1" x1="205" y1="131" x2="205" y2="150" stroke="#378ADD" stroke-width="2" opacity="0"/>
<line id="stream2" x1="214" y1="131" x2="214" y2="150" stroke="#378ADD" stroke-width="2" opacity="0"/>
<text x="226" y="166" font-family="sans-serif" font-size="10" fill="#185FA5" text-anchor="middle">flow</text>
</svg>

<svg id="barrier" width="100%" viewBox="0 0 280 180" role="img" style="margin-bottom:8px; display:none;">
<title>market crossing a barrier</title><desc>Drive at top pushes the market across a switching-cost barrier into adopters. Ball colour reflects the region.</desc>
<defs><marker id="pa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="60" y="16" font-family="sans-serif" font-size="11" fill="#888780" text-anchor="middle">market</text>
<text x="225" y="16" font-family="sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle">adopters</text>
<text id="drivelbl" x="140" y="30" font-family="sans-serif" font-size="11" font-weight="500" fill="#854F0B" text-anchor="middle">drive</text>
<line id="push" x1="116" y1="40" x2="164" y2="40" stroke="#BA7517" stroke-width="3" marker-end="url(#pa)"/>
<rect id="wall" x="134" y="56" width="14" height="96" rx="2" fill="#F4C0D1" stroke="#D4537E" stroke-width="1"/>
<text id="costlbl" x="141" y="168" font-family="sans-serif" font-size="11" fill="#993556" text-anchor="middle">cost</text>
<g id="balls"></g>
</svg>

<div class="metrics">
<div class="metric"><span id="t-v" class="m-label">V</span><span id="vval" class="m-val">0.8</span></div>
<div class="metric"><span id="t-r" class="m-label">R</span><span id="rval" class="m-val">0.3</span></div>
<div class="metric"><span id="t-i" class="m-label">I</span><span id="ival" class="m-val">2.7</span></div>
<div class="metric"><span id="t-p" class="m-label">P</span><span id="pval" class="m-val">2.1</span></div>
</div>

</div>
</div>

</div>
</div>


<script src="adoption_ohms_law_triple_mode.config.js"></script>
<script src="adoption_ohms_law_triple_mode.js"></script>

</body>
</html>
