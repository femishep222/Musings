<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Useful - Relationship Helper</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#141414;
    color:#e5e5e5;
    margin:0;
    padding:30px;
}


.container{
    max-width:700px;
    margin:auto;
    background:#1e1e1e;
    padding:25px;
    border-radius:18px;
    box-shadow:0 8px 25px rgba(0,0,0,.5);
}


/* BRAND LOGO */

.logo{
    text-align:center;
    margin-bottom:15px;
}


.logo svg{
    width:120px;
    height:120px;
}


.logo h1{
    margin-top:10px;
    font-size:38px;
    font-weight:900;
    letter-spacing:-1px;

    background:linear-gradient(
        90deg,
        #0F172A,
        #8B5CF6,
        #E63946,
        #00C853
    );

    -webkit-background-clip:text;
    color:transparent;
}


.tagline{
    text-align:center;
    color:#7ca4f3;
    font-size:15px;
    margin-top:-10px;
    margin-bottom:25px;
    font-weight:500;
}



/* FORM */

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}


input,
select,
textarea{

    width:100%;
    padding:12px;
    margin-top:6px;

    border-radius:8px;
    border:1px solid #333;
    background:#141414;
    color:#e5e5e5;

    font-size:16px;
}


input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#7ca4f3;
}


button{

    margin-top:20px;
    padding:13px 28px;

    background:#7ca4f3;
    color:#141414;

    border:none;
    border-radius:10px;

    cursor:pointer;
    font-size:16px;
    font-weight:bold;

}


button:hover{

    background:#9dbaf6;

}



#result{

    margin-top:30px;

    background:#1a2233;
    border-left:4px solid #7ca4f3;

    padding:18px;

    border-radius:12px;

}



</style>

</head>


<body>


<div class="container">


<!-- USEFUL BRAND LOGO -->

<div class="logo">


<svg viewBox="0 0 200 200">

<defs>


<!-- Trust + Empathy -->
<linearGradient id="trustEmpathy">

<stop offset="0%" stop-color="#2563EB"/>

<stop offset="100%" stop-color="#8B5CF6"/>

</linearGradient>


<!-- Love -->
<linearGradient id="loveGradient">

<stop offset="0%" stop-color="#FF6B6B"/>

<stop offset="100%" stop-color="#E63946"/>

</linearGradient>


</defs>



<!-- Deep Navy Background -->

<circle
cx="100"
cy="100"
r="92"
fill="#0F172A"
/>



<!-- Inner Ring -->

<circle
cx="100"
cy="100"
r="75"
fill="none"
stroke="#334155"
stroke-width="2"
/>



<!-- Purple/Blue Communication Bubble -->

<path

d="
M45 75
C45 45 85 35 115 50
C140 65 140 100 110 115
L75 135
L80 108
C55 105 45 95 45 75Z
"

fill="url(#trustEmpathy)"

/>



<!-- White Connection Bubble -->

<path

d="
M155 95
C155 125 115 140 85 120
C70 110 65 95 75 80
C90 60 125 65 135 85
L145 110
L140 95
C150 95 155 95 155 95Z
"

fill="white"

/>



<!-- Coral Heart -->

<path

d="
M100 125
C85 110 70 100 70 85
C70 70 90 65 100 80
C110 65 130 70 130 85
C130 100 115 110 100 125Z
"

fill="url(#loveGradient)"

/>



<!-- Green Growth Leaf -->

<path

d="
M115 55
C135 45 145 55 140 75
C125 75 115 65 115 55Z
"

fill="#00C853"

/>



<!-- Growth Stem -->

<path

d="
M120 75
C110 85 105 95 105 105
"

stroke="#00C853"
stroke-width="5"
fill="none"
stroke-linecap="round"

/>



</svg>


<h1>Useful</h1>

<p class="tagline">
Connect. Communicate. Grow.
</p>


</div>




<p>
A simple relationship conversation helper.
</p>



<label>
Years of relationship
</label>

<input id="years" type="number" value="1">



<label>
Your age
</label>

<input id="age" type="number" value="18">



<label>
Gender
</label>

<select id="gender">

<option>Male</option>

<option>Female</option>

<option>Prefer not to say</option>

</select>



<label>
Relationship type
</label>

<select id="type">

<option>Hetero</option>

<option>Same sex</option>

<option>Non-binary</option>

</select>



<label>
Current situation
</label>

<select id="status">

<option>Healthy relationship</option>

<option>Situationship</option>

<option>Taking a break</option>

<option>Recently broke up</option>

</select>



<label>
What happened?
</label>

<textarea 
id="problem"
rows="5"
placeholder="Explain what happened..."
></textarea>



<button onclick="generate()">
Get Advice
</button>



<div id="result">

Your advice will appear here.

</div>



</div>



<script>


function generate(){


let status=document.getElementById("status").value;


let result=document.getElementById("result");



let advice={


"Healthy relationship":
"Keep communicating, appreciating each other, and continuing to grow together.",


"Situationship":
"Have an honest conversation about expectations, feelings, and boundaries.",


"Taking a break":
"Respect each other's space while keeping communication clear and respectful.",


"Recently broke up":
"Give yourself time to heal and focus on rebuilding your confidence and happiness."

};



result.innerHTML=

"<h2>Useful Advice</h2><p>"
+
advice[status]
+
"</p>";


}


</script>



</body>

</html>
