<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RunwayDesigns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

<style>
body{
    font-family: 'Playfair Display', Georgia, serif;
    background:#f4f4f4;
    margin:0;
    padding:40px;
    color: #000000;
    box-sizing:border-box;
    min-height:100vh;
    position:relative;
}

/* ---------- Split background video: catwalk (left) / dressing a
   mannequin (right) -- streamed from Pexels' CDN, nothing uploaded ---------- */
.videoBg{
    position:fixed;
    inset:0;
    z-index:0;
    display:flex;
    overflow:hidden;
}
.videoBg .half{
    position:relative;
    width:50%;
    height:100%;
    overflow:hidden;
}
.videoBg .half:first-child{
    border-right:2px solid rgba(255,255,255,.35);
}
.videoBg video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter:brightness(.55) saturate(.9);
}
.videoBg .half::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.15);
}

/* Container with a seamless black and white floral pattern border */
.container{
    position:relative;
    z-index:1;
    max-width:650px;
    margin:auto;
    background:rgba(255,255,255,.55);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
    border: 24px solid transparent;
    border-image: url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' width='60' height='60' viewBox='0 0 60 60'%3E%3Cpath d='M30,10 C33,2 42,2 45,10 C53,7 58,15 50,20 C58,25 53,33 45,30 C42,38 33,38 30,30 C27,38 18,38 15,30 C7,33 2,25 10,20 C2,15 7,7 15,10 C18,2 27,2 30,10 Z' fill='none' stroke='%23000000' stroke-width='2'/%3E%3Ccircle cx='30' cy='20' r='4' fill='%23000000'/%3E%3Cpath d='M0,45 Q15,40 30,45 T60,45' fill='none' stroke='%23000000' stroke-width='1' stroke-dasharray='2,2'/%3E%3C/svg%3E") 24 repeat;
}

h1{
    text-align:center;
    color:#000000;
    font-weight: bold;
    margin-bottom: 5px;
}

/* BLACK FRAME COMPONENT */
.image-banner {
    width: 100%;
    height: 180px;
    background-color: #000000;
    margin: 20px 0;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    padding: 12px;
    position: relative;
    overflow: hidden; /* Keeps sparkles inside the rounded corners */
}

/* Inner decorative white dashed line */
.image-banner::before {
    content: '';
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    bottom: 10px;
    border: 2px dashed rgba(255, 255, 255, 0.4);
    border-radius: 12px;
    pointer-events: none;
    z-index: 1;
}

/* Main Text Style */
.image-banner h2 {
    color: #ffffff;
    font-size: 32px;
    letter-spacing: 1px;
    margin: 0;
    font-weight: normal;
    text-align: center;
    padding: 0 25px;
    font-style: italic;
    z-index: 2; /* Sits on top of sparkles */
    text-shadow: 0 2px 8px #000000;
}

/* Brand name pops relative to the softer "Welcome to" lead-in */
.image-banner h2 .brandName{
    font-weight: 700;
    font-style: normal;
    font-size: 1.2em;
    letter-spacing: 1px;
}

/* WHITE SPARKLES CLASS */
.sparkle {
    position: absolute;
    background: #ffffff;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    /* Creates a bright 4-point star lens flare effect */
    box-shadow: 
        0 0 6px #ffffff,
        0 0 12px #ffffff,
        0 0 2px 10px rgba(255, 255, 255, 0.1),
        -15px 0 12px -3px rgba(255,255,255,0.6),
        15px 0 12px -3px rgba(255,255,255,0.6),
        0 -15px 12px -3px rgba(255,255,255,0.6),
        0 15px 12px -3px rgba(255,255,255,0.6);
    opacity: 0.85;
    z-index: 1;
}

/* Sparkle Positioning Coordinates */
.sp-1 { top: 25px; left: 40px; transform: scale(0.6); }
.sp-2 { top: 40px; right: 60px; transform: scale(0.8); }
.sp-3 { bottom: 30px; left: 80px; transform: scale(0.7); }
.sp-4 { bottom: 25px; right: 45px; transform: scale(0.5); }
.sp-5 { top: 30px; left: 50%; transform: scale(0.5); }
.sp-6 { bottom: 20px; left: 30%; transform: scale(0.6); }

input,select,button{
    width:100%;
    padding:12px;
    margin-top:12px;
    font-size:16px;
    font-family: 'Playfair Display', Georgia, serif;
    box-sizing: border-box;
}

input, select {
    border: 1px solid #000000;
    border-radius: 6px;
}

button{
    background:#000000;
    color:white;
    border:none;
    cursor:pointer;
    border-radius:6px;
    font-weight: bold;
}

button:hover{
    background:#333333;
}

#results{
    margin-top:25px;
    background:#f9f9f9;
    padding:15px;
    border-radius:8px;
    border: 1px dashed #000000;
}

ul{
    padding-left:20px;
}
</style>
</head>

<body>

<!-- Background video, streamed directly from Pexels (free stock footage,
     no attribution required) -- left half is a runway walk for modeling,
     right half is a designer dressing a mannequin for fashion design. -->
<div class="videoBg" aria-hidden="true">
    <div class="half">
        <video autoplay muted loop playsinline preload="auto"
            src="https://videos.pexels.com/video-files/9511841/9511841-uhd_2732_1440_25fps.mp4">
        </video>
    </div>
    <div class="half">
        <video autoplay muted loop playsinline preload="auto"
            src="https://videos.pexels.com/video-files/4620563/4620563-uhd_1440_2732_25fps.mp4">
        </video>
    </div>
</div>

<div class="container">

<!-- Black frame containing explicit white sparkle elements -->
<div class="image-banner">
    <div class="sparkle sp-1"></div>
    <div class="sparkle sp-2"></div>
    <div class="sparkle sp-3"></div>
    <div class="sparkle sp-4"></div>
    <div class="sparkle sp-5"></div>
    <div class="sparkle sp-6"></div>
    
    <h2>Welcome to <span class="brandName">RunwayDesigns</span></h2>
</div>

<p>
Discover places that may help you get started in modeling or fashion design.
</p>

<form onsubmit="event.preventDefault(); findPlaces();">
    <label for="location">Location</label>
    <input type="text" id="location" placeholder="Example: Boston">

    <label for="age">Age</label>
    <input type="number" id="age" placeholder="Example: 13">

    <label for="career">Career Interest</label>
    <select id="career">
        <option>Modeling</option>
        <option>Fashion Designing</option>
    </select>

    <button type="submit">Find Places</button>
</form>

<div id="results"></div>

</div>

<script>
function findPlaces(){
    const location=document.getElementById("location").value.trim();
    const age=document.getElementById("age").value;
    const career=document.getElementById("career").value;

    let places=[];

    if(career==="Modeling"){
        places=[
            "Community theater and performance programs",
            "Youth modeling workshops",
            "Photography clubs for portfolio building",
            "Local fashion shows",
            "Modeling agencies that accept teen submissions with parent/guardian permission"
        ];
    }else{
        places=[
            "Fashion design classes",
            "Sewing workshops",
            "Art museums for inspiration",
            "Fabric and craft stores",
            "School art and fashion clubs"
        ];
    }

    if(location.toLowerCase().includes("boston")){
        places.push("MassArt (public events)");
        places.push("Boston Public Library creative workshops");
        places.push("Local Boston Fashion Week events");
    }

    document.getElementById("results").innerHTML=
    `
    <h2>Results</h2>
    <p><strong>Location:</strong> ${location || "Not entered"}</p>
    <p><strong>Age:</strong> ${age || "Not entered"}</p>
    <p><strong>Career:</strong> ${career}</p>
    <h3>Places to Explore</h3>
    <ul>
        ${places.map(place=>`<li>${place}</li>`).join("")}
    </ul>
    <p><strong>Tip:</strong> If you're under 18, bring a parent or guardian when contacting agencies or attending auditions.</p>
    `;
}
</script>

</body>
</html>
